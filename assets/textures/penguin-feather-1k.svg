<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <filter id="feather" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.19" numOctaves="3" seed="17" result="fibers"/>
    <feColorMatrix in="fibers" type="matrix" values="1.45 0 0 0 -.22  0 1.45 0 0 -.22  0 0 1.45 0 -.22  0 0 0 1 0" result="contrast"/>
    <feGaussianBlur in="contrast" stdDeviation=".28" result="soft"/>
    <feBlend in="SourceGraphic" in2="soft" mode="soft-light"/>
  </filter>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#707780"/>
    <stop offset=".45" stop-color="#a3a9ae"/>
    <stop offset="1" stop-color="#626a73"/>
  </linearGradient>
</defs>
<rect width="100%" height="100%" fill="url(#base)" filter="url(#feather)"/>
</svg>
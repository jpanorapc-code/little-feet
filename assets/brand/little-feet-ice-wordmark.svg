<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 225" role="img" aria-labelledby="title desc">
  <title id="title">Little Feet Technologies</title>
  <desc id="desc">Transparent icy Little Feet Technologies wordmark with frozen blue-white lettering and icicle details.</desc>
  <defs>
    <linearGradient id="iceFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".20" stop-color="#eefcff"/>
      <stop offset=".48" stop-color="#a9deeb"/>
      <stop offset=".72" stop-color="#d9f7ff"/>
      <stop offset="1" stop-color="#78aec0"/>
    </linearGradient>
    <linearGradient id="iceDrop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8fbff" stop-opacity=".96"/>
      <stop offset=".55" stop-color="#9bd9e8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#58889a" stop-opacity=".84"/>
    </linearGradient>
    <filter id="iceRough" x="-10%" y="-35%" width="120%" height="190%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .07" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.9" xChannelSelector="R" yChannelSelector="G" result="rough"/>
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#00162f" flood-opacity=".68"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#bcefff" flood-opacity=".44"/>
    </filter>
  </defs>

  <g filter="url(#iceRough)" font-family="Segoe UI Variable, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    <text x="750" y="128" font-size="108" letter-spacing="-2.5" fill="url(#iceFill)">Little Feet Technologies</text>
  </g>

  <g fill="url(#iceDrop)" opacity=".95">
    <path d="M175 134 l12 0 -6 37z"/>
    <path d="M245 134 l10 0 -5 24z"/>
    <path d="M340 134 l13 0 -6.5 44z"/>
    <path d="M470 134 l11 0 -5.5 29z"/>
    <path d="M565 134 l12 0 -6 39z"/>
    <path d="M675 134 l9 0 -4.5 22z"/>
    <path d="M770 134 l13 0 -6.5 41z"/>
    <path d="M905 134 l11 0 -5.5 28z"/>
    <path d="M1010 134 l13 0 -6.5 47z"/>
    <path d="M1125 134 l10 0 -5 26z"/>
    <path d="M1240 134 l12 0 -6 37z"/>
    <path d="M1335 134 l9 0 -4.5 23z"/>
  </g>

  <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity=".48">
    <path d="M190 70 l34 0" stroke-width="2.4"/>
    <path d="M420 84 l50 -8" stroke-width="2"/>
    <path d="M640 62 l38 6" stroke-width="2"/>
    <path d="M840 80 l46 -10" stroke-width="2"/>
    <path d="M1078 63 l44 5" stroke-width="2"/>
    <path d="M1250 83 l39 -8" stroke-width="2"/>
  </g>
</svg>
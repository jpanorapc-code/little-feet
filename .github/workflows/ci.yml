name: Little Feet CI

on:
  push:
    branches: [main, fix/real-subscriptions-payfast-89c6f75, security/login-notifications-human-check, fix/login-human-check-fast, feat/real-school-core-upgrades-a44f74]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Syntax checks
        run: |
          node --check server.js
          node --check failover-mode.js
          node --check backup.js
          node --check backup-server.js
          node --check tests/shared-db-failover.integration.test.js
          node --check tests/subscription-payfast.test.js
          node --check tests/login-security.test.js
          node --check tests/login-language.test.js
          node --check auth-crypto.js
          node --check service-worker.js
          node --check assets/mobile-pwa.js
          node --check assets/sa-sams-integration.js
          node --check assets/curriculum-frameworks.js
          node --check assets/education-stages.js
          node --check finance-automation-server.js
          node --check school-core-upgrades-server.js
          node --check advanced-school-operations-server.js
          node --check assets/school-core-upgrades.js
          node --check assets/advanced-school-operations.js
          node --check tests/school-core-upgrades.test.js
          node --check tests/advanced-school-operations.test.js
          node --check tests/school-core-browser.test.cjs
          node --check lib/storage/object-storage.js
          node --check assets/finance-automation.js
          node --check assets/preferences-enhancements.js
          node --check assets/legal-notices.js
          node --check scripts/write-deploy-release.js
          node --check scripts/audit-route-connections.js

      - name: Whole-project integrity audit
        run: npm run audit:project

      - name: Full regression suite
        run: npm test

      - name: Shared PostgreSQL standby failover rehearsal
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: node tests/shared-db-failover.integration.test.js

      - name: Capacity smoke test
        run: npm run test:capacity

      - name: High severity dependency audit
        run: npm audit --audit-level=high

      - name: Git history secret-pattern scan
        run: node tests/history-secrets.test.js

      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD || git diff --check

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Portal role and navigation regression
        run: node tests/portal-ui.test.cjs

      - name: School core browser regression
        run: node tests/school-core-browser.test.cjs

      - name: Responsive layout regression
        run: node tests/responsive-layout.test.cjs

      - name: Ambient background interaction regression
        env:
          LF_BROWSER_CHANNEL: chrome
        run: node tests/ambient-background.test.cjs

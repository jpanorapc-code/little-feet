name: Little Feet CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "hardening/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run authentication and tenant-isolation tests
        run: npm test
      - name: Run capacity smoke test
        run: npm run test:capacity
      - name: Check production dependencies for high-severity advisories
        run: npm audit --omit=dev --audit-level=high

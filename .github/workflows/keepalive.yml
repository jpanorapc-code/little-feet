name: Little Feet free uptime heartbeat

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Keep the web service and pilot database active
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 https://littlefeet.co.za/api/keepalive
